<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>lgrtk data flow</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .b { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
      .hw { fill: #eef2ff; stroke: #4338ca; }
      .svc { fill: #ecfdf5; stroke: #047857; }
      .t { fill: #0f172a; text-anchor: middle; font-weight: 600; }
      .s { fill: #475569; text-anchor: middle; font-size: 12px; }
      .e { stroke: #475569; stroke-width: 1.4; fill: none; marker-end: url(#a); }
      .d { stroke: #047857; stroke-width: 1.4; fill: none; marker-end: url(#a); stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="880" height="330" fill="#f8fafc"/>

  <rect class="b hw" x="20" y="40" width="150" height="80" rx="8"/>
  <text class="t" x="95" y="70">LG290P</text><text class="s" x="95" y="90">Waveshare board</text><text class="s" x="95" y="106">CH343 → /dev/ttyACM0</text>

  <rect class="b" x="210" y="40" width="120" height="80" rx="8"/>
  <text class="t" x="270" y="70">SerialPort</text><text class="s" x="270" y="90">raw 8N1, exclusive</text><text class="s" x="270" y="106">460800 (detected)</text>

  <rect class="b" x="370" y="40" width="130" height="80" rx="8"/>
  <text class="t" x="435" y="70">StreamFramer</text><text class="s" x="435" y="90">NMEA checksum</text><text class="s" x="435" y="106">RTCM CRC-24Q</text>

  <rect class="b" x="540" y="40" width="140" height="80" rx="8"/>
  <text class="t" x="610" y="70">nmea::Parse*</text><text class="s" x="610" y="90">GGA RMC GST EPE</text><text class="s" x="610" y="106">PQTM replies</text>

  <rect class="b" x="720" y="40" width="140" height="80" rx="8"/>
  <text class="t" x="790" y="70">EpochAssembler</text><text class="s" x="790" y="90">one Fix per epoch</text><text class="s" x="790" y="106">latency: 1 sentence</text>

  <path class="e" d="M170,80 H208"/><path class="e" d="M330,80 H368"/><path class="e" d="M500,80 H538"/><path class="e" d="M680,80 H718"/>

  <rect class="b" x="370" y="170" width="310" height="60" rx="8"/>
  <text class="t" x="525" y="196">Lg290pReceiver (I/O thread, state machine)</text>
  <text class="s" x="525" y="216">identify · configure · stale · reconnect · commands</text>
  <path class="e" d="M790,120 V200 H682"/>
  <text class="s" x="800" y="160" text-anchor="start">OnFix / LatestFix()</text>

  <rect class="b svc" x="20" y="170" width="150" height="60" rx="8"/>
  <text class="t" x="95" y="196">NtripClient</text><text class="s" x="95" y="216">v1 / v2, GGA upload</text>
  <path class="d" d="M170,200 H368"/><text class="s" x="270" y="222">Inject(whole RTCM frames)</text>
  <path class="d" d="M270,200 V120"/><text class="s" x="300" y="150" text-anchor="start">written between reads</text>

  <rect class="b svc" x="720" y="250" width="140" height="60" rx="8"/>
  <text class="t" x="790" y="276">Projection</text><text class="s" x="790" y="296">PROJ, built once, µs</text>
  <path class="e" d="M680,220 C710,240 720,260 718,275"/>

  <rect class="b" x="370" y="260" width="310" height="44" rx="8"/>
  <text class="t" x="525" y="287">your application · lgrtk CLI · (M2) lgrtkd gpsd daemon</text>
  <path class="e" d="M525,230 V258"/>
</svg>
